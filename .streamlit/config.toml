# Streamlit settings for the customer chat frontend (frontend/app.py).
# Read from the directory where `streamlit run` is started: run it from the project root.
# Secrets never go here (.streamlit/secrets.toml is git-ignored, and none are needed).

[client]
# Customers see a generic message for an unexpected error; type, message and traceback
# go to the server console only.
showErrorDetails = "none"
# Hide developer options (rerun, clear cache, deploy) from visitors.
toolbarMode = "minimal"

[runner]
# A bare expression on its own line must not be written to the page (it could show a
# variable such as the session state by accident).
magicEnabled = false
# Finish the current run (e.g. recording a reply) before starting the next one, so
# session state is never changed by two runs at once.
fastReruns = false

[browser]
# No usage statistics sent to Streamlit.
gatherUsageStats = false

[server]
# Only this machine can open the page. Until client sites and customers are
# authenticated, the frontend is for local demos; to show it on a network on purpose,
# start it with --server.address 0.0.0.0.
address = "localhost"
# Keep Streamlit's protection against cross-site requests.
enableXsrfProtection = true

# The look is set here first; frontend/styles.css only adds what the theme cannot (the
# two message bubble styles and wrapping of long words). A neutral slate palette with
# one blue accent. Contrast on white (WCAG AA needs 4.5:1 for normal text):
# text 17.9:1, captions (text at 60% opacity) about 4.7:1, links and buttons 6.7:1.
[theme]
base = "light"
primaryColor = "#1d4ed8"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f1f5f9"
textColor = "#0f172a"
borderColor = "#e2e8f0"
showWidgetBorder = true
showSidebarBorder = true
linkColor = "#1d4ed8"
linkUnderline = true
# Text of the status badges, darker than Streamlit's defaults so they reach 4.5:1 on
# their own tinted backgrounds.
greenTextColor = "#166534"
orangeTextColor = "#9a3412"
redTextColor = "#b91c1c"
grayTextColor = "#475569"
font = "sans-serif"
baseFontSize = 16
headingFontSizes = ["2.25rem", "1.75rem", "1.375rem"]
headingFontWeights = [700, 600]
baseRadius = "medium"
# Pill-shaped buttons: suggestions and clarification choices read as chips.
buttonRadius = "full"
# Space above the title (Streamlit adds the header's height on top, so the title is
# never hidden under it on phones).
paddingTop = "2rem"

[theme.sidebar]
backgroundColor = "#f8fafc"
secondaryBackgroundColor = "#f1f5f9"
borderColor = "#e2e8f0"
