# Reverse proxy for the single-server deployment (deploy/compose.yaml).
#
# Listeners inside the container (the unprivileged image cannot bind below 1024):
#   8080  plain HTTP: redirects to HTTPS, plus a local health check for Docker
#   8443  HTTPS: the customer chat page (public)
#   9443  HTTPS: the staff dashboard (published on 127.0.0.1 only by default, plus
#         HTTP basic authentication in front of the dashboard's own staff token)
#
# The FastAPI backend is not proxied, except GET /healthz -> /api/v1/ready for uptime
# monitoring. Both Streamlit pages call the backend server-side on internal networks.

worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Writable paths on the tmpfs (the root filesystem is read-only).
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    server_tokens off;

    # Path only, never the query string or the referrer (they can carry customer data),
    # matching the application's own request logging.
    log_format main '$remote_addr [$time_local] "$request_method $uri $server_protocol" '
                    '$status $body_bytes_sent $request_time $server_port "$http_user_agent"';
    access_log /dev/stdout main;

    sendfile on;
    keepalive_timeout 30s;
    client_header_timeout 15s;
    client_body_timeout 15s;
    send_timeout 30s;
    # The pages exchange small messages; nothing here accepts uploads.
    client_max_body_size 256k;

    # Docker's embedded DNS: re-resolve service names when a container is recreated.
    resolver 127.0.0.11 valid=10s ipv6=off;

    upstream customer_ui {
        zone customer_ui 64k;
        server customer:8501 resolve;
    }
    upstream admin_ui {
        zone admin_ui 64k;
        server admin:8502 resolve;
    }
    upstream backend_api {
        zone backend_api 64k;
        server backend:8000 resolve;
    }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Per-client limits at the edge. The backend sees every customer as the customer
    # container's address, so per-visitor limiting has to happen here
    # (docs/deployment-architecture.md, "Rate limiting").
    limit_req_zone  $binary_remote_addr zone=page_requests:10m rate=10r/s;
    # Each new Streamlit session (WebSocket) starts one conversation in the backend.
    limit_req_zone  $binary_remote_addr zone=new_sessions:10m  rate=20r/m;
    limit_conn_zone $binary_remote_addr zone=connections:10m;
    limit_req_zone  $binary_remote_addr zone=admin_requests:10m rate=5r/s;
    limit_req_status  429;
    limit_conn_status 429;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:TLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Common proxy settings for both Streamlit pages.
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 75s;
    proxy_send_timeout 75s;
    proxy_hide_header X-Powered-By;

    # --- 8080: HTTP -> HTTPS, and Docker's health check -----------------------------
    server {
        listen 8080 default_server;
        server_name _;

        location = /nginx-health {
            access_log off;
            allow 127.0.0.1;
            deny all;
            return 200 "ok\n";
        }
        location / {
            return 308 https://$host$request_uri;
        }
    }

    # --- 8443: customer chat page (public) ------------------------------------------
    server {
        listen 8443 ssl default_server;
        http2 on;
        server_name _;

        # HSTS without includeSubDomains or preload: those affect other sites on the
        # domain and are a decision for its owner.
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        # Streamlit serves inline scripts and styles, so a full CSP must be written and
        # tested for it; until then, frame protection only.
        add_header Content-Security-Policy "frame-ancestors 'none'" always;

        limit_conn connections 20;

        # Readiness for uptime monitors: knowledge base and storage status, no data.
        location = /healthz {
            limit_except GET { deny all; }
            limit_req zone=page_requests burst=10 nodelay;
            # The backend sets its own security headers; keep only this server's set.
            proxy_hide_header X-Content-Type-Options;
            proxy_hide_header X-Frame-Options;
            proxy_hide_header Referrer-Policy;
            proxy_hide_header Content-Security-Policy;
            proxy_pass http://backend_api/api/v1/ready;
        }

        # Streamlit's WebSocket: one per browser session, long-lived.
        location = /_stcore/stream {
            limit_req zone=new_sessions burst=10 nodelay;
            proxy_pass http://customer_ui;
            # Setting any proxy_set_header here drops the inherited ones: repeat them.
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 1h;
            proxy_send_timeout 1h;
        }

        location / {
            limit_req zone=page_requests burst=40 nodelay;
            proxy_pass http://customer_ui;
        }
    }

    # --- 9443: staff dashboard (restricted) -----------------------------------------
    server {
        listen 9443 ssl;
        http2 on;
        server_name _;

        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
        add_header Cache-Control "no-store" always;

        # A second, independent credential in front of the dashboard's staff token.
        auth_basic "Staff";
        auth_basic_user_file /etc/nginx/admin.htpasswd;

        # Optional network allow-list (for example a VPN range when ADMIN_BIND is not
        # 127.0.0.1). Note: through Docker's port publishing, connections from the host
        # itself may arrive from the bridge gateway address.
        # allow 10.8.0.0/24;
        # deny all;

        limit_conn connections 10;

        location = /_stcore/stream {
            limit_req zone=admin_requests burst=10 nodelay;
            proxy_pass http://admin_ui;
            # Setting any proxy_set_header here drops the inherited ones: repeat them.
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 1h;
            proxy_send_timeout 1h;
        }

        location / {
            limit_req zone=admin_requests burst=20 nodelay;
            proxy_pass http://admin_ui;
        }
    }
}
