# Streamlit's WebSocket (/_stcore/stream): one long-lived connection per browser tab.
include /etc/nginx/snippets/proxy-headers.conf;
proxy_set_header Upgrade    $http_upgrade;
proxy_set_header Connection $connection_upgrade;
# Streamlit pings the browser regularly; an idle hour ends the session.
proxy_read_timeout 1h;
proxy_send_timeout 1h;
# Messages must reach the browser at once, not wait in a buffer.
proxy_buffering off;
