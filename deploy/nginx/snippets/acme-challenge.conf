# ACME HTTP-01 challenges (Let's Encrypt): certbot writes a token file into
# deploy/nginx/acme/.well-known/acme-challenge/ (mounted read-only at /var/www/acme) and
# the certificate authority fetches it over plain HTTP on port 80. Only this path is
# served, only as plain text, no directory listings; everything else on port 80
# redirects to HTTPS or is closed. See docs/https-setup.md.
location ^~ /.well-known/acme-challenge/ {
    root /var/www/acme;
    default_type text/plain;
    autoindex off;
    try_files $uri =404;
}
