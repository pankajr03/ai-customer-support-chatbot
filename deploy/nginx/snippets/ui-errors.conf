# Shown when a Streamlit page is down, restarting or too slow (502, 504), instead of
# Nginx's default error page: no server name or version, a retry hint, nothing cached.
location @ui_unavailable {
    default_type text/html;
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-store" always;
    add_header Retry-After "10" always;
    return 503 '<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Temporarily unavailable</title></head><body style="font-family:sans-serif;max-width:32rem;margin:4rem auto;padding:0 1rem;line-height:1.5"><h1>Temporarily unavailable</h1><p>The chat is restarting or busy. Please try again in a minute.</p></body></html>\n';
}
