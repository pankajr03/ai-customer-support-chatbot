# Errors Nginx itself produces on /api/ routes, in the API's own JSON shape
# ({"error": {"code", "message", "request_id"}}, codes from app/models/errors.py). They
# reveal nothing about the servers behind. Errors the backend returns (its 404, 429, 503
# with a request ID) pass through unchanged: proxy_intercept_errors stays off.

location @api_not_found {
    default_type application/json;
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-store" always;
    return 404 '{"error":{"code":"NOT_FOUND","message":"Not found.","request_id":null}}\n';
}

location @api_too_large {
    default_type application/json;
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-store" always;
    return 413 '{"error":{"code":"PAYLOAD_TOO_LARGE","message":"The request body is too large.","request_id":null}}\n';
}

location @api_rate_limited {
    default_type application/json;
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-store" always;
    add_header Retry-After "5" always;
    return 429 '{"error":{"code":"RATE_LIMITED","message":"Too many requests. Please wait a moment and try again.","request_id":null}}\n';
}

# The backend is down, restarting or too slow (502, 504): a temporary failure.
location @api_unavailable {
    default_type application/json;
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-store" always;
    add_header Retry-After "10" always;
    return 503 '{"error":{"code":"SERVICE_UNAVAILABLE","message":"The service is temporarily unavailable. Please try again later.","request_id":null}}\n';
}
