# Staff dashboard: private networks only.
#
# Staff authentication is a development-grade prototype (static bearer tokens: no
# expiry, MFA or revocation without a restart; SEC-08, docs/authentication-review.md),
# so the dashboard must not be reachable from the public internet. ADMIN_BIND=127.0.0.1
# is the first barrier; this list is the second, for when ADMIN_BIND is changed to reach
# a VPN and a public interface ends up included.
#
# Docker keeps the real source address for connections from other machines (it uses
# NAT for published ports), so a public client is refused here (403). Connections from
# the server itself arrive from a Docker bridge address (172.16.0.0/12) and are allowed;
# that is the SSH-tunnel path. Not a substitute for the bind address: with Docker's
# userland proxy handling outside traffic (some rootless or IPv6 setups), every client
# appears as a bridge address.
allow 127.0.0.0/8;
allow 10.0.0.0/8;         # private networks and most VPNs (WireGuard, OpenVPN)
allow 172.16.0.0/12;      # private networks, Docker bridges (the SSH-tunnel path)
allow 192.168.0.0/16;     # private networks
allow 100.64.0.0/10;      # carrier-grade NAT range used by some VPNs (e.g. Tailscale)
allow ::1;
allow fc00::/7;           # IPv6 unique local addresses
deny all;
