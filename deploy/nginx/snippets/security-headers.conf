# Response headers for every HTTPS response, errors included ("always"). Included at
# server level, and again in any location that sets add_header itself (add_header in a
# location replaces the inherited set).
#
# HSTS without includeSubDomains or preload: those affect other sites on the domain and
# are a decision for its owner.
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
# Streamlit serves inline scripts and styles, so a full Content-Security-Policy must be
# written and tested for it; until then, frame protection only.
add_header Content-Security-Policy "frame-ancestors 'none'" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
