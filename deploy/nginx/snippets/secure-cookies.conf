# TLS ends here, so the Streamlit pages behind see plain HTTP and set their cookie
# (_streamlit_xsrf, the double-submit XSRF token) without the Secure flag: Streamlit
# adds it only when it terminates TLS itself (server.sslCertFile). Add it to every
# cookie passed to the browser, so none is ever sent over plain HTTP. SameSite=Lax and
# the deliberate absence of HttpOnly (the page's JavaScript reads the XSRF token) are
# kept as Streamlit sets them. The API sets no cookies (bearer tokens only).
# See docs/https-setup.md, "Cookies".
proxy_cookie_flags ~ secure;
