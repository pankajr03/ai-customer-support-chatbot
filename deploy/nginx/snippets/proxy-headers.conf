# Request headers for every proxied request (included wherever proxy_set_header is
# used: a location that sets any proxy_set_header stops inheriting the others).
#
# Nginx is the edge, so the only trustworthy client address is the TCP peer
# ($remote_addr). Anything the client sent in X-Forwarded-For, X-Real-IP, Forwarded or
# X-Forwarded-* is REPLACED or removed, never appended to ($proxy_add_x_forwarded_for
# would keep a forged value). The backend trusts these headers only from this proxy's
# fixed address (FORWARDED_ALLOW_IPS in deploy/compose.yaml).
#
# Host keeps the port the browser used ($http_host, not $host). Streamlit accepts a
# WebSocket only when its Origin matches the Host (or is localhost): on a non-default
# port, such as the dashboard's 8443, "Origin: https://admin.example.com:8443" would
# not match "Host: admin.example.com" and every WebSocket would be refused (403,
# verified on Docker). The name part was already matched against server_name; any other
# name never gets here (catch-all servers).
proxy_set_header Host              $http_host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host  "";
proxy_set_header X-Forwarded-Port  "";
proxy_set_header Forwarded         "";
