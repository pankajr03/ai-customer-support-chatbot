# Project metadata and tool configuration.
# Dependencies are managed in requirements.txt.

[project]
name = "ai-customer-support-chatbot"
version = "0.1.0"
description = "AI-powered customer support chatbot API built with FastAPI."
readme = "README.md"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers --strict-config"
markers = [
    "sample_data: checks the bundled sample knowledge base in data/faqs.json; deselect with -m 'not sample_data' when using client data",
    "embedding_model: loads the real embedding model (slow); runs only with RUN_EMBEDDING_MODEL_TESTS=1 and the model cached locally",
    "openai_live: makes small, paid requests to the real OpenAI API; runs only with RUN_OPENAI_LIVE_TESTS=1 and an OPENAI_API_KEY",
]
filterwarnings = [
    # Starlette recommends httpx2 for TestClient; httpx is kept deliberately for now (see Task 3).
    "ignore:Using `httpx` with `starlette.testclient` is deprecated:starlette.exceptions.StarletteDeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["data"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
# Stage 12: informational type checking (scripts/quality_checks.ps1 reports the count;
# it does not fail the run). 87 findings on app/ when introduced, all typing precision
# (pydantic str->enum coercion, JSON-schema example dicts, guarded Optionals), no defect.
python_version = "3.11"
files = ["app"]
ignore_missing_imports = true
